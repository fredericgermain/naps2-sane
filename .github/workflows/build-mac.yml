name: Build macOS artifacts

on:
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Cancel running jobs when a new push happens to the same branch as otherwise it will
# tie up too many resources without providing much value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}
    name: mac-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install autoconf autoconf-archive automake libtool pkg-config gettext

      - name: Apply source patches
        run: ./scripts/apply-patches.sh

      # sane-backends derives its version from 'git describe' (git-version-gen)
      # at autoreconf time; the shallow submodule clone has no tags, which
      # turns SANE_DLL_V_MAJOR into the literal UNKNOWN.
      - name: Fetch sane-backends tags
        run: |
          git -C sources/sane-backends fetch --tags --unshallow origin \
            || git -C sources/sane-backends fetch --tags origin

      - name: Build
        run: ./scripts/build-mac-${{ matrix.arch }}.sh

      - name: Build config
        if: matrix.arch == 'arm64'
        run: ./scripts/build-config.sh

      - name: Check artifacts
        run: |
          test -f "artifacts/mac-${{ matrix.arch }}/sane/libsane-hpaio.1.so"
          test -f "artifacts/mac-${{ matrix.arch }}/libsane.1.dylib"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            grep -qx hpaio artifacts/config/sane/dll.conf
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: artifacts/mac-${{ matrix.arch }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: shared
          path: |
            artifacts/config
            artifacts/data
            artifacts/*-license*
            artifacts/*-authors*
          if-no-files-found: error

  pack:
    runs-on: macos-15
    # Wait until we have built everything
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download mac-arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: artifacts/mac-arm64

      - name: Download mac-x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-x64
          path: artifacts/mac-x64

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared
          path: artifacts

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Pack
        run: dotnet pack NAPS2.Sane.Binaries -c Release

      - name: Check package
        run: |
          pkg=$(ls NAPS2.Sane.Binaries/bin/Release/*.nupkg)
          unzip -l "$pkg" | grep -q "contentFiles/_macarm/sane/libsane-hpaio.1.so"
          unzip -l "$pkg" | grep -q "contentFiles/_mac/sane/libsane-hpaio.1.so"
          unzip -l "$pkg" | grep -q "contentFiles/_config/sane/dll.conf"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: NAPS2.Sane.Binaries/bin/Release/*.nupkg
          if-no-files-found: error
